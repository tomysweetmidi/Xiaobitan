*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}

.ttl{position:absolute;left:14px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;color:#fff}

.at{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}

.ov{display:flex;gap:6px;flex-wrap:wrap}

.ov button.on{background:var(--chip);color:var(--ink);border-color:var(--acc)}
.day{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:10px}
.dl{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
.dt{display:flex;align-items:baseline;gap:10px;margin:6px 0 10px;flex-wrap:wrap}

.fcap{padding:10px 14px;font-size:13px;color:var(--mute)}
.fr{display:flex;align-items:center;border-top:1px solid var(--line);padding:8px 14px}
.fh{width:48px;flex:none;font-weight:800;font-size:18px;color:var(--acc);font-variant-numeric:tabular-nums}

.foot{font-size:12px;color:var(--mute);margin:18px 4px 0;line-height:1.6}

<script>

var S="6|03 19 35 52,7|10 28 46,8|04 22 40 58,9|16 34 52,10|10 28 46,11|04 22 40 58,12|16 34 52,13|10 28 46,14|04 22 40 58,15|16 34 52,16|10 28 46,17|04 22 40 58,18|16 34 52,19|10 28 46,20|04 22 40 58,21|16 34 53,22|12 32 51,23|09 26 42 57";

  we:S}
};
var NAMES={wd:"平日",sat:"週六",sun:"週日、國定假日"};
function parse(s){var o=[];s.split(",").forEach(function(p){var a=p.split("|"),h=+a[0];a[1].split(" ").forEach(function(m){o.push((h===0?24:h)*60+ +m)})});return o}
var P={};for(var k in DATA){P[k]={wd:parse(DATA[k].wd),we:parse(DATA[k].we)}}

var dir="qz",ov="";

function tpe(){
  var f=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Taipei",hour12:false,year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric",second:"numeric"});
  var o={};f.formatToParts(new Date()).forEach(function(p){o[p.type]=+p.value});
  if(o.hour===24)o.hour=0;
  o.dow=new Date(Date.UTC(o.year,o.month-1,o.day)).getUTCDay();
  return o;
}
function autoType(dow){return dow===0?"sun":dow===6?"sat":"wd"}
function pad(n){return n<10?"0"+n:""+n}
function fmt(min){min=((min%1440)+1440)%1440;return pad(Math.floor(min/60))+":"+pad(min%60)}

var BUILT={"2026-01-01":"開國紀念日","2026-02-16":"除夕","2026-02-17":"春節初一","2026-02-18":"春節初二","2026-02-19":"春節初三","2026-02-20":"小年夜補假","2026-02-27":"和平紀念日補假","2026-04-03":"兒童節補假","2026-04-06":"清明節補假","2026-05-01":"勞動節","2026-06-19":"端午節","2026-09-25":"中秋節","2026-09-28":"教師節","2026-10-09":"國慶日補假","2026-10-26":"光復節補假","2026-12-25":"行憲紀念日",
"2027-01-01":"開國紀念日","2027-02-04":"小年夜","2027-02-05":"除夕","2027-02-08":"春節初三","2027-02-09":"春節補假","2027-02-10":"春節補假","2027-03-01":"和平紀念日補假","2027-04-05":"清明節","2027-04-06":"兒童節補假","2027-04-30":"勞動節補假","2027-06-09":"端午節","2027-09-15":"中秋節","2027-09-28":"教師節","2027-10-11":"國慶日補假","2027-10-25":"光復節","2027-12-24":"行憲紀念日補假","2027-12-31":"開國紀念日補假"};
var BW={"2026-02-15":"小年夜","2026-02-28":"和平紀念日","2026-04-04":"兒童節","2026-04-05":"清明節","2026-10-10":"國慶日","2026-10-25":"光復節","2027-02-06":"春節初一","2027-02-07":"春節初二","2027-02-28":"和平紀念日","2027-04-04":"兒童節","2027-05-01":"勞動節","2027-10-10":"國慶日","2027-12-25":"行憲紀念日"};
var LIVE={},TRY={},FILE={},fileChecked="";
function covered(y){return !!LIVE[y]||!!FILE[y]||y===2026||y===2027}
fetch("holidays.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():Promise.reject()}).then(function(j){
  if(j&&j.years){FILE=j.years;fileChecked=j.checked||"";render()}
}).catch(function(){});
function ensureYear(y){
  if(TRY[y])return;TRY[y]=1;
  var c=new AbortController(),tm=setTimeout(function(){c.abort()},5000);
  fetch("https://cdn.jsdelivr.net/gh/ruyut/TaiwanCalendar/data/"+y+".json",{signal:c.signal})
  .then(function(r){return r.ok?r.json():Promise.reject()})
  .then(function(a){
    if(!Array.isArray(a)||a.length<300)return;
    var H={},W={};
    a.forEach(function(e){
      var q=String(e.date||"");if(q.length!==8)return;
      var k=q.slice(0,4)+"-"+q.slice(4,6)+"-"+q.slice(6);
      var w=new Date(Date.UTC(+q.slice(0,4),+q.slice(4,6)-1,+q.slice(6))).getUTCDay();
      if(e.isHoliday&&w>0&&w<6)H[k]=e.description||"國定假日";
      if(!e.isHoliday&&(w===0||w===6))W[k]=e.description||"補行上班日";
    });
    LIVE[y]={H:H,W:W};render();
  }).catch(function(){}).then(function(){clearTimeout(tm)});
}
function dinfo(off,t){
  var u=new Date(Date.UTC(t.year,t.month-1,t.day+off));
  var y=u.getUTCFullYear(),w=u.getUTCDay();
  var k=y+"-"+pad(u.getUTCMonth()+1)+"-"+pad(u.getUTCDate());
  var src=LIVE[y]||FILE[y];
  var h=src?src.H[k]:BUILT[k];
  var wk=src?src.W[k]:null;
  var o={y:y,m:u.getUTCMonth()+1,d:u.getUTCDate(),w:w,cov:covered(y)};
  if(wk){o.type="wd";o.label="平日";o.why="補行上班日（"+wk+"）"}
  else if(h&&w>0&&w<6){o.type="sun";o.label="國定假日";o.why=h}
  else if(w===0){o.type="sun";o.label="週日";o.why=BW[k]?BW[k]+"（星期日）":"星期日"}
  else if(w===6){o.type="sat";o.label="週六";o.why=BW[k]?BW[k]+"（星期六）":"星期六"}
  else{o.type="wd";o.label="平日";o.why="一般上班日"}
  return o;
}
var showFull=false,lastFull="";
function fullHTML(list,nowSec){
  var rows={},nx=null;
  list.forEach(function(m){if(nx===null&&m*60>nowSec)nx=m;var h=Math.floor(m/60);(rows[h]=rows[h]||[]).push(m)});
  return Object.keys(rows).map(Number).sort(function(a,b){return a-b}).map(function(h){
    return '<div class="fr"><div class="fh">'+pad(h%24)+(h===24?"<small>隔日</small>":"")+'</div><div class="fm">'+
      rows[h].map(function(m){return '<span class="'+(m*60<=nowSec?"p":m===nx?"n":"")+'">'+pad(m%60)+"</span>"}).join("")+"</div></div>";
  }).join("");
}
function render(){
  var t=tpe(),nowSec=t.hour*3600+t.minute*60+t.second;
  document.getElementById("clock").textContent=pad(t.hour)+":"+pad(t.minute)+":"+pad(t.second);
  ensureYear(t.year);
  var di=dinfo(0,t),todayType=ov||di.type;
  document.documentElement.setAttribute("data-day",todayType);
  document.getElementById("date").textContent=di.m+"月"+di.d+"日（週"+"日一二三四五六".charAt(di.w)+"）";
  var dn=document.getElementById("dnote");
  if(ov&&ov!==di.type){
    document.getElementById("dtype").textContent=NAMES[ov];
    document.getElementById("dwhy").textContent="手動指定";
    dn.className="dn warn";dn.textContent="⚠ 你手動指定了「"+NAMES[ov]+"」，今天實際是「"+di.label+"」（"+di.why+"）。要恢復請點「自動判斷」。";
  }else{
    document.getElementById("dtype").textContent=ov?NAMES[ov]:di.label;
    document.getElementById("dwhy").textContent=(ov?"手動指定・":"")+di.why;
    dn.className="dn";
    dn.textContent=LIVE[t.year]?"✔ 已連線核對政府行事曆（"+t.year+" 年）":FILE[t.year]?"行事曆資料由系統自動更新（最近檢查："+fileChecked+"）。":di.cov?"依行政院人事行政總處行事曆內建（2026、2027 年），目前未連線核對。":"⚠ 超出內建假日資料範圍，只依星期判斷，請手動確認。";
  }
  document.getElementById("from").textContent=DATA[dir].from;

  var fb=document.getElementById("fullbtn"),fd=document.getElementById("full"),fh="";
  fb.textContent=showFull?"收起整天時刻表":"顯示整天時刻表";
  if(showFull)fh='<div class="fcap">'+(dir==="qz"?"往七張":"往小碧潭")+"・"+NAMES[todayType]+"・全日班次（亮色為下一班，淡色為已過）</div>"+fullHTML(P[dir][todayType==="wd"?"wd":"we"],nowSec);
  if(fh!==lastFull){fd.innerHTML=fh;lastFull=fh}
  var ev=[];
  for(var off=-1;off<=1;off++){
    var ty=off===0?todayType:dinfo(off,t).type;
    var list=P[dir][ty==="wd"?"wd":"we"];
    list.forEach(function(m,i){ev.push({m:off*1440+m,last:i===list.length-1})});
  }
  ev.sort(function(a,b){return a.m-b.m});
  var nx=ev.filter(function(e){return e.m*60>nowSec}).slice(0,6);

  var big=document.getElementById("count"),at=document.getElementById("at");
  if(!nx.length){big.textContent="--";at.textContent="查無班次";return}
  var d=nx[0].m*60-nowSec,mm=Math.floor(d/60),ss=d%60;
  big.innerHTML=mm+"<small>分</small>"+pad(ss)+"<small>秒</small>";
  at.innerHTML=fmt(nx[0].m)+" 開"+(nx[0].last?'<span class="tag">末班</span>':"");

  var h="";
  nx.slice(1).forEach(function(e){
    var r=Math.ceil((e.m*60-nowSec)/60);
    h+="<li><b>"+fmt(e.m)+(e.last?'<span class="tag">末班</span>':"")+"</b><span>"+r+" 分鐘後</span></li>";
  });
  document.getElementById("list").innerHTML=h;
}
function sync(){
  document.querySelectorAll("#seg button").forEach(function(b){b.classList.toggle("on",b.dataset.d===dir)});
  document.querySelectorAll("#ov button").forEach(function(b){b.classList.toggle("on",b.dataset.o===ov)});
}
document.getElementById("seg").addEventListener("click",function(e){
  var d=e.target.dataset&&e.target.dataset.d;if(!d)return;dir=d;
  sync();render();
});
document.getElementById("ov").addEventListener("click",function(e){
  if(!e.target.dataset||e.target.dataset.o===undefined)return;ov=e.target.dataset.o;sync();render();
});
document.getElementById("fullbtn").addEventListener("click",function(){showFull=!showFull;render()});
sync();render();setInterval(render,1000);
document.addEventListener("visibilitychange",render);
</script>
</body>
</html>
